<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apps" />
    <link rel="manifest" href="/manifest.json" />
    <title>Apps</title>
    <link rel="icon" type="image/png" href="/apps.png" />
    <link rel="apple-touch-icon" href="/apps.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Poppins', sans-serif;
        color: #fff;
        min-height: 100vh;
        background-color: #0f1115;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(135deg, #0f1115, #1a1d23);
        background-size: 80px 80px, 80px 80px, 100% 100%;
        z-index: -1;
      }

      header {
        text-align: center;
        margin-bottom: 56px;
      }

      header h1 {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #fff;
      }

      header p {
        font-size: 0.9rem;
        color: #9ca3af;
        margin-top: 6px;
        font-weight: 300;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        width: 100%;
        max-width: 900px;
      }

      .app-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 28px 20px;
        background: #1a1d23;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        text-decoration: none;
        color: #fff;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
      }

      .app-card:hover {
        background: #22262e;
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }

      .app-card:active {
        transform: scale(0.97);
      }

      .app-icon {
        width: 72px;
        height: 72px;
        border-radius: 0;
        object-fit: cover;
        background: #0f1115;
      }

      .app-icon-placeholder {
        width: 72px;
        height: 72px;
        border-radius: 0;
        background: #22262e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }

      .app-name {
        font-size: 0.9rem;
        font-weight: 500;
        text-align: center;
        color: #fff;
      }

      .app-description {
        font-size: 0.75rem;
        font-weight: 300;
        text-align: center;
        color: #9ca3af;
        line-height: 1.4;
      }

      /* Loading skeleton */
      .skeleton {
        background: linear-gradient(90deg, #1a1d23 25%, #22262e 50%, #1a1d23 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 20px;
        height: 160px;
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Error state */
      .error-msg {
        color: #9ca3af;
        font-size: 0.9rem;
        text-align: center;
      }

      /* Responsive: mobile → 2 por linha */
      @media (max-width: 640px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 14px;
        }

        .app-card {
          padding: 22px 14px;
        }

        .app-icon {
          width: 60px;
          height: 60px;
        }

        .app-icon-placeholder {
          width: 60px;
          height: 60px;
        }

        header h1 {
          font-size: 1.4rem;
        }

        body {
          padding: 36px 16px;
        }
      }

      /* Tablet: 4 por linha se couber, senão 2 */
      @media (min-width: 641px) and (max-width: 860px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
          max-width: 480px;
        }
      }
    </style>
  </head>
  <body>
    <header>
    </header>

    <main>
      <div class="grid" id="grid">
        <!-- cards gerados via JS -->
      </div>
    </main>

    <script>
      async function loadApps() {
        const grid = document.getElementById('grid');

        try {
          const res = await fetch('/apps.json');
          if (!res.ok) throw new Error('Falha ao carregar');
          const apps = await res.json();

          grid.innerHTML = '';

          apps.forEach(app => {
            const card = document.createElement('a');
            card.href = app.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.className = 'app-card';

            let iconHtml;
            if (app.icon) {
              iconHtml = `<img
                class="app-icon"
                src="${app.icon}"
                alt="${app.name}"
                onerror="this.outerHTML='<div class=\\'app-icon-placeholder\\'>📦</div>'"
              />`;
            } else {
              iconHtml = `<div class="app-icon-placeholder">📦</div>`;
            }

            card.innerHTML = `
              ${iconHtml}
              <span class="app-name">${app.name}</span>
              ${app.description ? `<span class="app-description">${app.description}</span>` : ''}
            `;

            grid.appendChild(card);
          });
        } catch (err) {
          grid.innerHTML = '<p class="error-msg">Não foi possível carregar os apps.</p>';
          console.error(err);
        }
      }

      loadApps();
    </script>
  </body>
</html>
